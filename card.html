<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Glöggkort</title>
<!-- The card shown as the WhatsApp preview: a postcard back stood on end (1080×1350), so it fills a
     phone screen's width. tools/build_cards.py renders one per guest (?to=Name), plus card-sv/en.jpg for links without one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=IM+Fell+English+SC&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); }
  .card { position: relative; width: 1080px; height: 1350px; box-sizing: border-box; display: flex; flex-direction: column; }
  .card .lingon { position: absolute; inset: 0; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
  .post { display: flex; align-items: flex-start; flex: none; }
  .post .postmark { width: 230px; height: 121px; margin: 58px -46px 0 0; transform: rotate(-9deg); position: relative; z-index: 1; }
  .post .stamp { width: 150px; height: 178px; }
  .line { font-size: 72px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .top .line { flex: 1; }
  .msg { font-size: 70px; line-height: 1.2; margin: auto 0; }
  .msg .when { margin-top: 30px; color: var(--berry-ink); }
  .msg .osa { margin-top: 30px; font-size: 54px; color: var(--berry-ink); }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="lingon.js"></script>
<script>
  const T = {
    sv: { to: 'Till: dig ♡', msg: 'Välkommen på glögg-AW.', when: 'Fredag 27 nov 18.00',
          osa: 'OSA senast 20 nov - tryck på kortet för att svara', from: 'Sandra ♡' },
    en: { to: 'To: you ♡', msg: 'Welcome to glögg after work.', when: 'Friday 27 Nov 6 pm',
          osa: 'RSVP by 20 Nov - tap the card to reply', from: 'Sandra ♡' },
  };
  const W = 1080, H = 1350;
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'sv';
  const t = T[lang];
  // ?to=Magnus addresses the card to one guest (tools/build_cards.py); without it, to "dig".
  const to = new URLSearchParams(location.search).get('to');
  if (to) t.to = `${lang === 'en' ? 'To' : 'Till'}: ${to.replace(/[&<>"]/g, '')}`;
  document.documentElement.lang = lang;
  const card = document.getElementById('card');
  const frame = Lingon.frame(W, H, { margin: 40, scale: 2, reach: 0.36 });
  card.innerHTML = frame +
    `<div class="top"><div class="line hand">${t.to}</div>
       <div class="post">${Lingon.postmark('STOCKHOLM · 27 NOV 2026 · ', '★')}${Lingon.stamp(112, 132, 'SVERIGE')}</div></div>
     <div class="msg hand"><div>${t.msg}</div><div class="when">${t.when}</div><div class="osa">${t.osa}</div></div>
     <div class="line hand">${t.from}</div>`;
  // Keep everything inside the frame's reach, with some air.
  const depth = Number(card.querySelector('.lingon').dataset.depth);
  card.style.padding = `${depth + 24}px ${depth + 30}px ${depth + 36}px`;
  window.frameDepth = depth;
  document.fonts.ready.then(() => { window.cardReady = true; });
</script>
</body>
</html>
